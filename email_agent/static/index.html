<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服装智能助手</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <!-- 登录页 -->
        <div id="login-page" class="page">
            <div class="login-box">
                <h1>🏠 服装智能助手</h1>
                <p>基于双轨RAG + 知识图谱的智能跟单助手</p>
                <input type="email" id="email-input" placeholder="请输入您的邮箱号">
                <button id="login-btn">进入系统</button>
                <p id="login-error" class="error"></p>
            </div>
        </div>

        <!-- 主页面 -->
        <div id="main-page" class="page hidden">
            <!-- 顶部栏 -->
            <header class="header">
                <div class="header-title">🏠 服装智能助手</div>
                <div class="header-user">
                    <span id="user-name"></span>
                    <button id="logout-btn">退出</button>
                </div>
            </header>

            <div class="main-container">
                <!-- 侧边栏 -->
                <aside class="sidebar">
                    <div class="sidebar-new-chat">
                        <button class="new-chat-btn" onclick="startNewChat()">+ 新对话</button>
                    </div>

                    <div class="sidebar-section">
                        <div class="sidebar-header" id="header-today-summary" onclick="toggleSection('today-summary')">
                            <span class="arrow">▼</span> 今日汇总
                        </div>
                        <div id="today-summary" class="sidebar-content">
                            <div id="morning-push-content" class="morning-push">
                                加载中...
                            </div>
                        </div>
                    </div>

                    <div class="sidebar-section">
                        <div class="sidebar-header" id="header-my-styles" onclick="toggleSection('my-styles')">
                            <span class="arrow">▼</span> 我负责的
                        </div>
                        <div id="my-styles" class="sidebar-content">
                            <div id="styles-list" class="styles-list">
                                加载中...
                            </div>
                        </div>
                    </div>

                    <div class="sidebar-section">
                        <div class="sidebar-header" id="header-history" onclick="toggleSection('history')">
                            <span class="arrow">▼</span> 历史会话
                        </div>
                        <div id="history" class="sidebar-content">
                            <div id="history-list" class="history-list">
                                加载中...
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- 主对话区 -->
                <main class="chat-area">
                    <div id="chat-messages" class="chat-messages">
                        <!-- 消息将动态插入这里 -->
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="输入您的问题...">
                        <button id="send-btn">发送</button>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
