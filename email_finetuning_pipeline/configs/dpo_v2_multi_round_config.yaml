### V2 多轮 DPO 训练配置 (PRO 6000 96GB)
### 在 SFT 基础上用偏好对优化多轮决策

# 模型配置
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
adapter_name_or_path: ./outputs/sft-v2
template: qwen

# 阶段配置
stage: dpo
do_train: true

# 数据配置
dataset: dpo_multi_round_v2_train
eval_dataset: dpo_multi_round_v2_val
cutoff_len: 8192
max_samples: null
overwrite_cache: true
preprocessing_num_workers: 16

# 输出配置
output_dir: ./outputs/dpo-v2
logging_steps: 10
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-7
num_train_epochs: 2.5
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
use_rslora: false

optim: adamw_torch
weight_decay: 0.01
max_grad_norm: 1.0

pref_beta: 0.1
pref_loss: sigmoid
pref_ftx: 0.0

per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 50
save_strategy: steps
save_steps: 50
load_best_model_at_end: true
report_to: tensorboard
