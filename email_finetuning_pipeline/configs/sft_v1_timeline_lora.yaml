### V1 时间线推理 SFT 训练配置 (PRO 6000 96GB)
### 专用于: 款号级时间线分析、延期根因推理
### 说明: V1模型负责接收款号+事件列表，输出结构化时间线分析报告

# ============================================================================
# 模型配置 (Model)
# ============================================================================
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
template: qwen

# ============================================================================
# 训练阶段配置 (Stage)
# ============================================================================
stage: sft
do_train: true

# ============================================================================
# 数据配置 (Dataset)
# ============================================================================
dataset: sft_v1_timeline_train
eval_dataset: sft_v1_timeline_val
cutoff_len: 8192
max_samples: null
overwrite_cache: true
preprocessing_num_workers: 16

# ============================================================================
# 输出配置 (Output)
# ============================================================================
output_dir: ./outputs/sft-v1
logging_steps: 10
plot_loss: true
overwrite_output_dir: true

# ============================================================================
# 训练配置 (Training)
# ============================================================================
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

# ============================================================================
# LoRA配置 (LoRA)
# ============================================================================
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
use_rslora: false

# ============================================================================
# 优化器配置 (Optimizer)
# ============================================================================
optim: adamw_torch
weight_decay: 0.01
max_grad_norm: 1.0

# ============================================================================
# 验证配置 (Evaluation)
# ============================================================================
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 25
save_strategy: steps
save_steps: 25
load_best_model_at_end: true

# ============================================================================
# 日志配置 (Logging)
# ============================================================================
report_to: tensorboard
